name: Deploy Pages

on: { push: { branches: [main] } }

permissions: { contents: read, pages: write, id-token: write }

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Require browser-safe Weedypedia configuration
        env:
          VITE_SUPABASE_URL: "${{ vars.SUPABASE_URL }}"
          VITE_SUPABASE_PUBLISHABLE_KEY: "${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
          VITE_PRIVACY_VERSION: "${{ vars.PRIVACY_VERSION }}"
          VITE_TERMS_VERSION: "${{ vars.TERMS_VERSION }}"
          VITE_AUTH_REDIRECT_URL: "${{ vars.AUTH_REDIRECT_URL }}"
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_PRIVACY_VERSION"
          test -n "$VITE_TERMS_VERSION"
          test -n "$VITE_AUTH_REDIRECT_URL"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) exit 1 ;;
          esac
      - run: pnpm build
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          VITE_SUPABASE_URL: "${{ vars.SUPABASE_URL }}"
          VITE_SUPABASE_PUBLISHABLE_KEY: "${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
          VITE_PRIVACY_VERSION: "${{ vars.PRIVACY_VERSION }}"
          VITE_TERMS_VERSION: "${{ vars.TERMS_VERSION }}"
          VITE_AUTH_REDIRECT_URL: "${{ vars.AUTH_REDIRECT_URL }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
